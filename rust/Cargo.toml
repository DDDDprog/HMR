[package]
name = "humanoid-robot-gui"
version = "0.1.0"
edition = "2021"
description = "Desktop GUI for 2.5ft Humanoid Robot Control"
license = "MIT OR Apache-2.0"

[dependencies]
eframe = { version = "0.29", features = ["default", "accesskit"] }
egui = { version = "0.29", features = ["default", "accesskit"] }
serialport = "4.10.1"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[workspace]
members = []

[badges]
maintenance = { status = "actively-developed" }